# Builds every push to main (i.e. every merged PR) and publishes it as a regular
# GitHub release – but only if the version in manifest.json doesn't have a release yet.
# So: raise the version in manifest.json (and package.json) before merging into main,
# otherwise the merge doesn't create a release.
#
# Tag format matches the existing releases and the pre-release workflow: v<version>, e.g. v1.3.0.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to check whether the version already exists

      - name: Read version from manifest.json
        id: version
        run: |
          version=$(jq -r '.version' manifest.json)
          tag="v$version"
          echo "Version in manifest.json: $version"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::manifest.json version '$version' is not of the form MAJOR.MINOR.PATCH"
            exit 1
          fi
          pkg=$(jq -r '.version' package.json)
          if [ "$pkg" != "$version" ]; then
            echo "::warning::package.json has version $pkg, manifest.json has $version"
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists – no new release. Raise the version in manifest.json to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - if: steps.version.outputs.skip == 'false'
        run: npm ci

      - if: steps.version.outputs.skip == 'false'
        run: npm run build

      # Same layout and naming as the earlier releases (e.g. easyPDF_v1-2-0.zip).
      - name: Create zip
        id: zip
        if: steps.version.outputs.skip == 'false'
        run: |
          zip="easyPDF_v$(echo '${{ steps.version.outputs.version }}' | tr '.' '-').zip"
          zip -j "$zip" main.js manifest.json styles.css
          echo "file=$zip" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" "${{ steps.zip.outputs.file }}" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --latest \
            --generate-notes
